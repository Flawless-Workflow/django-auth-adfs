[tool.poetry]
name = "flawless-django-auth-adfs"
version = "1.16.0"  # Remember to also change __init__.py version
description = 'A Django authentication backend for Microsoft ADFS and AzureAD (Flawless Workflow fork)'
authors = ['Joris Beckers <joris.beckers@gmail.com>']
maintainers = ['Xavier Francisco <xavierfrancisco@flawlessworkflow.com>']
license = 'BSD-1-Clause'
homepage = 'https://github.com/Flawless-Workflow/django-auth-adfs'
repository = 'https://github.com/Flawless-Workflow/django-auth-adfs'
documentation = 'https://django-auth-adfs.readthedocs.io/en/latest'
keywords = ['django', 'authentication', 'adfs', 'azure', 'ad', 'oauth2']
readme = 'README.rst'
packages = [{ include = 'django_auth_adfs' }]
classifiers = [
    'Environment :: Web Environment',
    'Framework :: Django :: 5.1',
    'Framework :: Django :: 5.2',
    'Framework :: Django :: 6.0',
    'Intended Audience :: Developers',
    'Intended Audience :: End Users/Desktop',
    'Operating System :: OS Independent',
    'License :: OSI Approved :: BSD License',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Topic :: Internet :: WWW/HTTP',
    'Topic :: Internet :: WWW/HTTP :: Dynamic Content',
    'Topic :: Internet :: WWW/HTTP :: WSGI',
    'Topic :: Software Development :: Libraries :: Application Frameworks',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Development Status :: 5 - Production/Stable',
]

[tool.poetry.dependencies]
python = "^3.12"
django = '>=5.1,<7'
requests = '*'
urllib3 = '*'
cryptography = '*'
PyJWT = "*"

[tool.poetry.group.dev.dependencies]
responses = '*'
mock = '*'
coverage = '*'
djangorestframework = '*'
django-filter = "*"

[tool.poetry.group.release.dependencies]
python-kacl = '^0.7'
bumpver = '^2026.1132'

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
