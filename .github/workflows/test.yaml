name: Unit Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
        django-version: ['5.1', '5.2', '6.0']
    steps:
      - uses: actions/checkout@v4

      - uses: Flawless-Workflow/flawless-github-actions/setup-python@v1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Django ${{ matrix.django-version }}
        run: pip install "django~=${{ matrix.django-version }}.0"

      - name: Run tests
        run: |
          coverage run manage.py test -v 2
          coverage report -m
