name: Release

on:
  workflow_dispatch:
    inputs:
      release-type:
        type: choice
        description: Type of release
        required: true
        options:
          - 'patch'
          - 'minor'
          - 'major'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump-version:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      new-version: ${{ steps.bump-version.outputs.new-version }}
      new-sha: ${{ steps.bump-version.outputs.new-sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: Flawless-Workflow/flawless-github-actions/setup-python@v1
        with:
          poetry-install-args: '--only release --no-root'

      - uses: Flawless-Workflow/flawless-github-actions/bump-version@v1
        id: bump-version
        with:
          args: "--${{ github.event.inputs.release-type }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES

  create-github-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: bump-version
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.new-sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: 'RELEASE_NOTES'
          name: Release ${{ needs.bump-version.outputs.new-version }}
          tag_name: ${{ needs.bump-version.outputs.new-version }}
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-package:
    runs-on: ubuntu-latest
    needs: bump-version
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.new-sha }}

      - uses: Flawless-Workflow/flawless-github-actions/setup-python@v1

      - uses: Flawless-Workflow/flawless-github-actions/publish-python-package@v1
        with:
          registry-url: ${{ secrets.POETRY_HTTP_BASIC_PRIVATE_URL }}
          username: ${{ secrets.POETRY_HTTP_BASIC_PRIVATE_USERNAME }}
          password: ${{ secrets.POETRY_HTTP_BASIC_PRIVATE_PASSWORD }}
