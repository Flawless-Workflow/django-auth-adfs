name: Release

# Modeled on flawless-chunking-service-client's release.yaml. The org composite actions
# (setup-python, bump-version, publish-python-package) are private and unreachable from a
# public fork, so their steps are inlined here.

on:
  workflow_dispatch:
    inputs:
      release-type:
        type: choice
        description: Type of release
        required: true
        options:
          - 'patch'
          - 'minor'
          - 'major'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump-version:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      new-version: ${{ steps.new-version.outputs.new-version }}
      new-sha: ${{ steps.new-sha.outputs.new-sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure git user
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry and the release tools
        run: |
          pipx install poetry==2.5.1
          poetry config virtualenvs.create false
          poetry install --only release --no-root

      - name: Bump version
        run: bumpver update --${{ github.event.inputs.release-type }}

      - name: Retrieve new version
        id: new-version
        run: |
          eval "$(bumpver show --no-fetch --environ)"
          echo "new-version=${CURRENT_VERSION}"
          echo "new-version=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Retrieve the new version's commit SHA
        id: new-sha
        run: |
          echo "new-sha=$(git rev-parse HEAD)"
          echo "new-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES

  create-github-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: bump-version
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.new-sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: 'RELEASE_NOTES'
          name: Release ${{ needs.bump-version.outputs.new-version }}
          tag_name: ${{ needs.bump-version.outputs.new-version }}
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-package:
    runs-on: ubuntu-latest
    needs: bump-version
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.new-sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Build and publish
        run: |
          poetry config repositories.private "$REGISTRY_URL"
          poetry publish --build --repository private
        env:
          REGISTRY_URL: ${{ secrets.POETRY_HTTP_BASIC_PRIVATE_URL }}
          POETRY_HTTP_BASIC_PRIVATE_USERNAME: ${{ secrets.POETRY_HTTP_BASIC_PRIVATE_USERNAME }}
          POETRY_HTTP_BASIC_PRIVATE_PASSWORD: ${{ secrets.POETRY_HTTP_BASIC_PRIVATE_PASSWORD }}
